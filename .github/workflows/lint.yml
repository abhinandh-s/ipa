name: Check Markdown with Harper

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  harper:
    name: Lint Markdown Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download and Install Harper CLI
        run: |
          URL="https://github.com/Automattic/harper/releases/latest/download/harper-cli-x86_64-unknown-linux-gnu.tar.gz"
          curl -LO "$URL"
          tar -xzf harper-cli-x86_64-unknown-linux-gnu.tar.gz
          sudo mv harper /usr/local/bin/

      - name: Run Harper on Markdown Files
        run: |
          find . -name "*.md" -not -path "./.git/*" | xargs harper lint
